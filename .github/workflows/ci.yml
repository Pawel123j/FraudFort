name: CI

# Gałęzie robocze testuje zdarzenie pull_request; `push` na każdej gałęzi
# uruchamiał ten sam zestaw (w tym testy z Testcontainers) drugi raz.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Nowy push do PR-a anuluje przebieg, który i tak jest już nieaktualny.
# Przebiegi na main nie są anulowane, żeby każdy commit miał pełny wynik.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/orchestrator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      # Testcontainers (Postgres) uses the runner's Docker daemon.
      - run: ./gradlew test --no-daemon

  scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/scoring
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --frozen
      - run: uv run --frozen python -m pytest -q
      - name: Dependency audit (locked versions)
        run: |
          uv export --frozen --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --no-deps --disable-pip -r /tmp/requirements.txt
