name: CI

# Gałęzie robocze testuje zdarzenie pull_request; `push` na każdej gałęzi
# uruchamiał ten sam zestaw (w tym testy z Testcontainers) drugi raz.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Nowy push do PR-a anuluje przebieg, który i tak jest już nieaktualny.
# Przebiegi na main nie są anulowane, żeby każdy commit miał pełny wynik.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/orchestrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      # Testcontainers (Postgres) uses the runner's Docker daemon.
      - run: ./gradlew test --no-daemon

  scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/scoring
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run --frozen python -m pytest -q
      - name: Dependency audit (locked versions)
        run: |
          uv export --frozen --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --no-deps --disable-pip -r /tmp/requirements.txt
