name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/orchestrator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      # Testcontainers (Postgres) uses the runner's Docker daemon.
      - run: ./gradlew test --no-daemon

  scoring:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scoring
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run --frozen python -m pytest -q
      - name: Dependency audit (locked versions)
        run: |
          uv export --frozen --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --no-deps --disable-pip -r /tmp/requirements.txt
