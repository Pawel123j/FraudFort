# FraudFort — local development stack.
# Versions are floated to majors here; pin to specific patches in stage 8 (deploy).
name: fraudfort

services:
  postgres:
    image: postgres:16-alpine
    container_name: fraudfort-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraudfort}
      POSTGRES_USER: ${POSTGRES_USER:-fraudfort}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudfort_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraudfort} -d ${POSTGRES_DB:-fraudfort}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fraudfort

  redis:
    image: redis:7.4-alpine
    container_name: fraudfort-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fraudfort

volumes:
  postgres_data:
  redis_data:

networks:
  fraudfort:
    driver: bridge
