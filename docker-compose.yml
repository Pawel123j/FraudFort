# FraudFort — local development stack.
# Versions are floated to majors here; pin to specific patches in stage 8 (deploy).
name: fraudfort

# Usługi publikowane tylko na 127.0.0.1; hasła wymagane (brak wartości domyślnych) — FF-03.

services:
  postgres:
    image: postgres:16-alpine
    container_name: fraudfort-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraudfort}
      POSTGRES_USER: ${POSTGRES_USER:-fraudfort}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraudfort} -d ${POSTGRES_DB:-fraudfort}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fraudfort

  redis:
    image: redis:7.4-alpine
    container_name: fraudfort-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fraudfort

  scoring:
    build:
      context: ./services/scoring
    image: fraudfort/scoring:dev
    container_name: fraudfort-scoring
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SCORING_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - fraudfort

volumes:
  postgres_data:
  redis_data:

networks:
  fraudfort:
    driver: bridge
