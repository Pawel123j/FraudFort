# Testy: wartości niebędące sekretami. Dekoder JWT nie jest wywoływany w testach MockMvc
# (spring-security-test jwt()), a JWKS jest wskazany jawnie, więc start nie łączy się z siecią.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://issuer.fraudfort.test/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://issuer.fraudfort.test/.well-known/jwks.json
fraudfort.security.jwt.audience=fraudfort-api
# Nadpisywane przez @ServiceConnection (Testcontainers); wymagane do rozwiązania placeholdera.
POSTGRES_PASSWORD=unused-testcontainers-overrides-it
