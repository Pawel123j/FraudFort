spring:
  application:
    name: orchestrator
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fraudfort}
    username: ${POSTGRES_USER:fraudfort}
    password: ${POSTGRES_PASSWORD:fraudfort_dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

fraudfort:
  scoring:
    # Scoring service base URL. Overridden to http://scoring:8000 inside compose.
    base-url: ${SCORING_BASE_URL:http://localhost:8000}
    connect-timeout: 200ms
    read-timeout: 1s

server:
  port: ${ORCHESTRATOR_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  level:
    root: INFO
    io.fraudfort: DEBUG
