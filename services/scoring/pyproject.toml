[project]
name = "fraudfort-scoring"
version = "0.1.0"
description = "FraudFort real-time fraud scoring service (FastAPI). Stage 2 ships a transparent heuristic model behind a stable /score contract; the real MLflow-backed model is plugged in at stage 7 without changing the API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.27,<1.0",
]

[tool.uv]
# This is a deployable application, not a distributable library — uv should not
# try to build/install it as a wheel. App code is imported via pythonpath below.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"
